<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 295 54" width="100%" height="100%" fill="none">
  <!-- Minimalist Architectural Geometric Mark (Flat & Sharp) -->
  <g transform="translate(2, 6)">
    <!-- Obsidian Frame -->
    <rect x="0" y="0" width="42" height="42" rx="4" fill="#111111"/>
    
    <!-- Clean Geometric Dual 'M' Monogram (Mr & Mrs) -->
    <path d="M9 31 L9 13 L16 23 L21 16 L26 23 L33 13 L33 31" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Gold Zari Heritage Needle Diamond (Modern Precision) -->
    <path d="M21 26 L23 29 L21 32 L19 29 Z" fill="#C5A059"/>
  </g>

  <!-- Modern Flat High-Fashion Wordmark -->
  <g transform="translate(56, 0)">
    <!-- Primary Brand Name: MR & MRS MODERN -->
    <text x="0" y="26" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" letter-spacing="2.4" fill="#111111">MR &amp; MRS MODERN</text>
    
    <!-- Secondary Descriptor: ATELIER & COUTURE -->
    <text x="1" y="42" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.8" font-weight="700" letter-spacing="3.6" fill="#C5A059">ATELIER &bull; COUTURE &bull; DESIGN</text>
  </g>
</svg>